# Enhanced Zephyr 4.3.0 Configuration for PQC Benchmarking
# Verified compatible with Zephyr v4.3.0 (November 2025)
# DRAMATICALLY INCREASED STACK SIZE for McEliece variants (up to 1MB)
CONFIG_MAIN_STACK_SIZE=1048576
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
# Match the Zephyr 4.3 / SDK 1.0.x libc choice actually used by the toolchain.
CONFIG_PICOLIBC=y
# QEMU benchmark runs use the explicitly allowed test RNG/CSPRNG path.
# Do not enable entropy drivers when no real entropy device is present.
CONFIG_TEST_RANDOM_GENERATOR=y

# Enhanced timing subsystem for precise benchmarking
CONFIG_TIMING_FUNCTIONS=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

# Performance monitoring and profiling
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
CONFIG_STACK_SENTINEL=y

# Enhanced memory configuration - INCREASED for McEliece
CONFIG_HEAP_MEM_POOL_SIZE=1048576

# Keep benchmark timing noise low and avoid assertion overhead in measurements.
CONFIG_DEBUG=n
CONFIG_ASSERT=n

# POSIX compatibility (Zephyr 4.3.0: CONFIG_POSIX_API still valid)
CONFIG_POSIX_API=y

# Enable floating point support for accurate energy measurements
CONFIG_CBPRINTF_FP_SUPPORT=y
