# MIPS Malta Configuration Overlay
# MIPS Malta has only 1MB RAM (0x100000 bytes)
# Default prj.conf uses 1MB stack + 1MB heap = 2MB (too much!)
#
# Memory breakdown for ML-KEM-512:
# - Code/Data/BSS: ~820KB (increased due to Tier 2 entropy + validation gates)
# - Stack: 60KB (reduced from 1MB)
# - Heap: 119KB (reduced from 1MB)
# Total: ~999KB ≈ 1MB (exact fit!)

CONFIG_MAIN_STACK_SIZE=61440
CONFIG_HEAP_MEM_POOL_SIZE=121856
