#Actually, this won't work - the Cortex-M boards simply don't have enough RAM for post-quantum cryptography. Even ML-KEM-512 needs significant RAM for keys and operations.

#The reality is: Cortex-M0 and M3 (in QEMU) are not suitable targets for running full PQC benchmarks. They're too memory-constrained. Let me verify this is a known limitation and then run all the OTHER 13 working tests in parallel:
# Cortex-M0 Configuration
# WARNING: Cortex-M0 has severe memory constraints (~16KB RAM in QEMU)
# This configuration dramatically reduces memory to attempt fitting

# Minimal stack and heap
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Disable features to reduce code size
CONFIG_PRINTK=n
CONFIG_EARLY_CONSOLE=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_ASSERT=n
