# Clean benchmark profile - minimal noise, maximum authenticity
CONFIG_LOG=n
CONFIG_PRINTK=y
CONFIG_DEBUG=n
CONFIG_ASSERT=n
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PICOLIBC=y

# Authentic timing measurements
CONFIG_TIMING_FUNCTIONS=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

# Authentic stack measurement
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y

# Heap configuration for memory testing
CONFIG_HEAP_MEM_POOL_SIZE=1048576

# Use the non-physical test RNG path on QEMU, but label it honestly.
CONFIG_TEST_RANDOM_GENERATOR=y

# Minimal POSIX for compatibility
CONFIG_POSIX_API=y
