# Ultra-minimal configuration for ARM Cortex-M targets
# Only sets essential user-configurable options

# Basic memory settings
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=32768

# Essential subsystems for PQClean
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_UART_CONSOLE=y
CONFIG_TIMING_FUNCTIONS=y
CONFIG_POSIX_API=y
CONFIG_KERNEL_MEM_POOL=y
CONFIG_MINIMAL_LIBC=y

# Only set options we know are definitely user-configurable
CONFIG_WARN_DEPRECATED=n
