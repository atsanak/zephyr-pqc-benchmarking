# RX architecture configuration for qemu_rx
# Handles Renesas RX-specific build requirements

# Basic memory settings
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Enable random subsystem
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# Enable console output
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_UART_CONSOLE=y

# Enable timing for benchmarks
CONFIG_TIMING_FUNCTIONS=y

# Use minimal libc for embedded target
CONFIG_MINIMAL_LIBC=y

# Basic subsystems
CONFIG_KERNEL_MEM_POOL=y

# QEMU target configuration
CONFIG_QEMU_TARGET=y

# Linker optimizations for RX
CONFIG_BUILD_NO_GAP_FILL=y
CONFIG_LINKER_ORPHAN_SECTION_PLACE=y

# Disable problematic features
CONFIG_WARN_DEPRECATED=n
CONFIG_DEBUG=n
CONFIG_DEBUG_INFO=n
CONFIG_HAS_CMSIS_CORE=n
CONFIG_HAS_NRFX=n
CONFIG_SOC_FAMILY_NORDIC_NRF=n
CONFIG_QEMU_ICOUNT=n
