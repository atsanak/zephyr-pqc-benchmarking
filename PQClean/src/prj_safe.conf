# Minimal Zephyr project configuration for PQClean multi-KEM benchmark
# Only includes configurations that are likely to be available across Zephyr versions

# Basic console and serial support
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# C library support
CONFIG_NEWLIB_LIBC=y

# Entropy generation for cryptographic operations
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# Timing subsystem for benchmarking (essential)
CONFIG_TIMING_FUNCTIONS=y

# Stack monitoring (essential for embedded systems)
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
CONFIG_STACK_SENTINEL=y

# Memory configuration for larger KEMs
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=524288

# Basic monitoring (only core features)
CONFIG_THREAD_MONITOR=y

# Basic debugging (minimal set)
CONFIG_DEBUG=y

# POSIX API support for clean exit mechanisms
CONFIG_POSIX_API=y

# Note: Advanced configurations like STATS, STATS_THREAD, DEBUG_INFO
# are commented out as they may not be available in all Zephyr versions
# If you need these features, uncomment and test individually:
# CONFIG_STATS=y
# CONFIG_STATS_THREAD=y
# CONFIG_DEBUG_INFO=y

# Architecture-specific configurations are auto-detected by board files
# Do not set QEMU_TARGET, X86_64, etc. explicitly
