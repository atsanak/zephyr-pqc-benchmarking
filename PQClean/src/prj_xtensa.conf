# Xtensa architecture configuration for qemu_xtensa
# Handles Xtensa-specific header and toolchain requirements

# Basic memory settings
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Enable random subsystem
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# Enable console output
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_UART_CONSOLE=y

# Enable timing for benchmarks
CONFIG_TIMING_FUNCTIONS=y

# Use minimal libc
CONFIG_MINIMAL_LIBC=y

# Basic subsystems
CONFIG_KERNEL_MEM_POOL=y

# QEMU target configuration
CONFIG_QEMU_TARGET=y

# Xtensa-specific configurations
CONFIG_XTENSA_TOOLCHAIN_VARIANT="xtensa-dc233c_zephyr-elf"

# Disable problematic features
CONFIG_WARN_DEPRECATED=n
CONFIG_DEBUG=n
CONFIG_DEBUG_INFO=n
CONFIG_HAS_CMSIS_CORE=n
CONFIG_HAS_NRFX=n
CONFIG_SOC_FAMILY_NORDIC_NRF=n
CONFIG_QEMU_ICOUNT=n
