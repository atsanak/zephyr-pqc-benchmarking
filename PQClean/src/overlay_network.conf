# =============================================================================
# nRF5340-DK Network + TEE Configuration
# =============================================================================
# Extends overlay_tfm_rng.conf with networking for remote orchestration.
# Use BOTH overlays: -DOVERLAY_CONFIG="overlay_tfm_rng.conf;overlay_network.conf"
#
# NETWORK OPTIONS:
#   - BLE (Bluetooth Low Energy) - default, no gateway needed
#   - Thread/OpenThread - mesh networking, requires border router
#   - WiFi - requires external module (not on nRF5340)
#
# MEMORY IMPACT:
#   - CoAP stack: ~8KB code, ~2KB RAM
#   - MQTT stack: ~10KB code, ~4KB RAM
#   - Network buffers: ~4KB RAM
#   TOTAL: ~20KB code, ~10KB RAM additional
#
# Author: Aggelos Tsanaktsidis (Thesis Chapter 7)
# =============================================================================

# -----------------------------------------------------------------------------
# Networking Core
# -----------------------------------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_IPV4=n

# Network buffers (constrained sizing)
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_NET_BUF_DATA_SIZE=256

# IPv6 configuration
CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=3
CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=4
CONFIG_NET_MAX_CONTEXTS=6

# -----------------------------------------------------------------------------
# CoAP (Constrained Application Protocol) - PRIMARY
# -----------------------------------------------------------------------------
# CoAP is ideal for constrained devices:
# - UDP-based (low overhead)
# - Small message size
# - Observe pattern for async results

CONFIG_COAP=y
CONFIG_COAP_SERVER=y
CONFIG_COAP_CLIENT=y

# CoAP resources
CONFIG_COAP_WELL_KNOWN_BLOCK_WISE=y
CONFIG_COAP_EXTENDED_OPTIONS_LEN=y
CONFIG_COAP_EXTENDED_OPTIONS_LEN_VALUE=40

# -----------------------------------------------------------------------------
# MQTT (Optional - for cloud integration)
# -----------------------------------------------------------------------------
# MQTT is better for cloud connectivity:
# - TCP-based (reliable)
# - Pub/sub model
# - Good for aggregating results

CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y

# MQTT buffer sizes
CONFIG_MQTT_KEEPALIVE=60

# -----------------------------------------------------------------------------
# mbed TLS Configuration for mTLS (Mutual TLS)
# -----------------------------------------------------------------------------
# Required for secure MQTT broker communication with client certificates.
# Uses TF-M's PSA Crypto for hardware-accelerated operations.
#
# MEMORY IMPACT:
#   - mbed TLS core: ~40KB code, ~10KB RAM
#   - TLS buffers: ~16KB RAM (configurable)
#   - Certificates: ~4KB (depends on chain)
#   TOTAL: ~60KB code, ~30KB RAM additional
#
# WARNING: This significantly reduces available RAM for algorithms!
#          Only use with smaller KEMs (ml-kem-512) or disable for benchmarking.

CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y

# Use PSA Crypto from TF-M (hardware RNG, accelerated AES)
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_MBEDTLS_USE_PSA_CRYPTO=y

# TLS version - TLS 1.2 minimum (TLS 1.3 preferred but larger)
CONFIG_MBEDTLS_TLS_VERSION_1_2=y
# CONFIG_MBEDTLS_TLS_VERSION_1_3=y  # Uncomment for TLS 1.3 (adds ~10KB)

# Cipher suites (minimal set for constrained devices)
CONFIG_MBEDTLS_CIPHER_AES_ENABLED=y
CONFIG_MBEDTLS_CIPHER_GCM_ENABLED=y
CONFIG_MBEDTLS_CIPHER_CCM_ENABLED=y
CONFIG_MBEDTLS_CIPHER_CHACHA20_ENABLED=n
CONFIG_MBEDTLS_CIPHER_CBC_ENABLED=n

# Key exchange - ECDHE required for PFS
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_RSA_ENABLED=n
CONFIG_MBEDTLS_KEY_EXCHANGE_RSA_ENABLED=n
CONFIG_MBEDTLS_KEY_EXCHANGE_PSK_ENABLED=n

# Elliptic curves (P-256 is minimum, P-384 optional)
CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED=y
CONFIG_MBEDTLS_ECP_DP_SECP384R1_ENABLED=n
CONFIG_MBEDTLS_ECP_DP_SECP521R1_ENABLED=n
CONFIG_MBEDTLS_ECP_DP_CURVE25519_ENABLED=n

# Hash algorithms
CONFIG_MBEDTLS_MAC_SHA256_ENABLED=y
CONFIG_MBEDTLS_MAC_SHA384_ENABLED=n
CONFIG_MBEDTLS_MAC_SHA512_ENABLED=n

# X.509 certificates (required for mTLS)
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
CONFIG_MBEDTLS_X509_CRL_PARSE_C=n
CONFIG_MBEDTLS_X509_CSR_PARSE_C=n
CONFIG_MBEDTLS_X509_CSR_WRITE_C=n
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MBEDTLS_PEM_WRITE_C=n

# ASN.1 (required for certificates)
CONFIG_MBEDTLS_ASN1_PARSE_C=y
CONFIG_MBEDTLS_ASN1_WRITE_C=y

# mTLS client authentication
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_SSL_ALPN=n

# Buffer sizes (constrained for memory)
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=4096
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=4096
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096

# Session resumption (saves handshake overhead)
CONFIG_MBEDTLS_SSL_SESSION_TICKETS=y
CONFIG_MBEDTLS_SSL_CACHE_C=n

# Entropy from TF-M secure RNG
CONFIG_MBEDTLS_ENTROPY_C=y
CONFIG_MBEDTLS_ENTROPY_POLL_ZEPHYR=y
CONFIG_MBEDTLS_CTR_DRBG_C=y

# Memory allocation
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=32768

# Debugging (disable in production)
CONFIG_MBEDTLS_DEBUG=n
CONFIG_MBEDTLS_DEBUG_LEVEL=0

# -----------------------------------------------------------------------------
# Transport Selection: BLE (Default)
# -----------------------------------------------------------------------------
# BLE is available on nRF5340 without additional hardware.
# Uses IPv6 over BLE (IPSP/6LoWPAN)

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=n
CONFIG_BT_DEVICE_NAME="nRF5340-TEE-Bench"

# Bluetooth mesh disabled (overkill for point-to-point)
CONFIG_BT_MESH=n

# IPv6 over BLE
CONFIG_NET_L2_BT=y
CONFIG_NET_L2_BT_SHELL=n

# BLE connection parameters
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1

# -----------------------------------------------------------------------------
# Alternative: OpenThread (Mesh Networking)
# -----------------------------------------------------------------------------
# Uncomment for Thread mesh networking (requires border router)
# 
# CONFIG_NET_L2_OPENTHREAD=y
# CONFIG_OPENTHREAD_NORDIC_LIBRARY_MASTER=y
# CONFIG_OPENTHREAD_THREAD_VERSION_1_3=y
# CONFIG_OPENTHREAD_COMMISSIONER=n
# CONFIG_OPENTHREAD_JOINER=y
# CONFIG_OPENTHREAD_NETWORK_NAME="PQC-TEE-Net"
# CONFIG_OPENTHREAD_XPANID="de:ad:00:be:ef:00:ca:fe"

# -----------------------------------------------------------------------------
# DNS (for MQTT broker resolution)
# -----------------------------------------------------------------------------
CONFIG_DNS_RESOLVER=n

# -----------------------------------------------------------------------------
# Sockets API
# -----------------------------------------------------------------------------
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_POSIX_NAMES=y
CONFIG_NET_SOCKETS_POLL_MAX=4

# -----------------------------------------------------------------------------
# Network Shell (debugging)
# -----------------------------------------------------------------------------
CONFIG_NET_SHELL=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# -----------------------------------------------------------------------------
# Memory Adjustment for Network Stack
# -----------------------------------------------------------------------------
# Network adds ~10KB RAM overhead, adjust heap accordingly

# Reduce heap slightly to make room for network buffers
# (This is applied ON TOP of overlay_tfm_rng.conf settings)
# CONFIG_HEAP_MEM_POOL_SIZE will be set per-algorithm

# Network thread stack
CONFIG_NET_TX_STACK_SIZE=1024
CONFIG_NET_RX_STACK_SIZE=1536

# -----------------------------------------------------------------------------
# Timing for Network Metrics
# -----------------------------------------------------------------------------
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_USER_API=y

# =============================================================================
# COMBINED MEMORY BUDGET (TEE + Network)
# =============================================================================
#
# nRF5340 Non-Secure: 448KB
#
# Component                    | Size
# -----------------------------|----------
# Zephyr kernel                | ~45KB
# TF-M NS shim                 | ~10KB
# Newlib libc                  | ~18KB
# Benchmark framework          | ~12KB
# Network stack (CoAP+BLE)     | ~20KB
# Network buffers              | ~10KB
# Console/UART                 | ~4KB
# Static data                  | ~15KB
# -----------------------------|----------
# TOTAL FIXED                  | ~134KB
# -----------------------------|----------
# AVAILABLE for stack+heap     | ~314KB (was 340KB without network)
#
# Per-algorithm sizing must account for ~26KB less available!
#
# =============================================================================
# BUILD COMMAND
# =============================================================================
#
# west build -b nrf5340dk/nrf5340/cpuapp/ns -p always \
#     -s PQClean/src -- \
#     -DOVERLAY_CONFIG="../overlay_tfm_rng.conf;../overlay_network.conf" \
#     -DENABLE_TEE=ON \
#     -DENABLE_NETWORK=ON \
#     -DENABLE_ML_KEM_512=ON
#
# =============================================================================
