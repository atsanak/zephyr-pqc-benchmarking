# Minimal Universal Zephyr Configuration for PQClean KEM Benchmarking
# Works across ALL QEMU architectures (x86, ARM, RISC-V, ARC, SPARC, MIPS, Xtensa)

# Basic kernel configuration
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=32768

# Console and output
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_UART_CONSOLE=y

# Random number generation (essential for crypto)
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# Timing for benchmarks
CONFIG_TIMING_FUNCTIONS=y

# Memory pools
CONFIG_KERNEL_MEM_POOL=y

# POSIX for exit()
CONFIG_POSIX_API=y
